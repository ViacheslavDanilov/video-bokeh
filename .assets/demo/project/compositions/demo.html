<template>

             aria-label="Video Bokeh, the demo app: picking an estimator and a seed, generating, adding panes, reordering them, zooming in, scrubbing and playing"></video>

    <!-- The generation wait, from 10.86 s to 14.38 s, plays at the factor edit.py printed. -->

  <script>
    (function () {
      // 2D transforms only: a 3D one would have Chrome rasterize the scaled app once and blur it.
      gsap.config({ force3D: false });
      const tl = gsap.timeline({ paused: true });
      // The camera: the app point (cx, cy) at the frame's center, at scale s. Times are the
      // recording's own (the step marks from edit.py), and no move overlaps a click.
      const at = (s, cx, cy) => ({ scale: s, x: 960 - s * cx, y: 540 - s * cy });

      const shot = (view, t, duration = 1.0) =>
        tl.to("#dm-stage", { ...view, duration, ease: "power2.inOut" }, t);
      tl.set("#dm-stage", { transformOrigin: "0 0", ...WIDE }, 0);
      shot(at(2.0, 480, 310), 0.75);       // the estimator's list and the seed
      shot(at(2.0, 480, 520), 8.69);       // down to Generate, with the cursor
      shot(at(2.4, 680, 275), 10.64, 0.9); // the progress line
      // The new sequence's one row of panes and the transport, cut in the empty margin left of
      // them; from the second added pane on, the two rows.
      shot(at(1.17, 1100, 525), 14.51);
      shot(at(1.175, 1103, 578.5), 27.67);
      tl.fromTo("#dm-speed-label", { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 11.64);
      tl.to("#dm-speed-label", { opacity: 0, filter: "blur(6px)", duration: 0.15, ease: "power2.in" }, 13.93);
      window.__timelines["demo"] = tl;
