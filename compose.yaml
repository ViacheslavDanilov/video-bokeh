services:
  web:
    build: ./frontend
    image: video-bokeh-web
    # Named outright so the container is video-bokeh-web, not video-bokeh-web-1.
    # There is one replica and there will be one. The project prefix stays because
    # container names are global to the daemon, and the lab machine will not be
    # running only this project.
    container_name: video-bokeh-web
    ports:
    - "3000:3000"
    depends_on:
    - api

  api:
    # From the repository root, where uv.lock is. backend/Dockerfile.dockerignore keeps
    # the context to what the image copies.
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: video-bokeh-api
    container_name: video-bokeh-api
    ports:
    - "8000:8000"
    environment:
      VIDEO_BOKEH_DATA_ROOT: /data
    volumes:
    # The libraries are named separately from the root so that one built elsewhere, such
    # as data/library_dev, can be served; by default they are data/library. Inside the
    # container they always land at /data/library, which is where the api looks by
    # default, so VIDEO_BOKEH_LIBRARY is a host-side setting only.
    - ${VIDEO_BOKEH_LIBRARY:-${VIDEO_BOKEH_DATA_ROOT:-./backend/data}/library}:/data/library:ro
    - ${VIDEO_BOKEH_DATA_ROOT:-./backend/data}/sequences:/data/sequences
