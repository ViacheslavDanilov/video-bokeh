services:
  web:
    build: ./frontend
    image: video-bokeh-web
    # Named outright so the container is video-bokeh-web, not video-bokeh-web-1.
    # There is one replica and there will be one. The project prefix stays because
    # container names are global to the daemon, and the lab machine will not be
    # running only this project.
    container_name: video-bokeh-web
    ports:
    - "3000:3000"
    depends_on:
    - api

  api:
    build: ./backend
    image: video-bokeh-api
    container_name: video-bokeh-api
    ports:
    - "8000:8000"
    environment:
      VIDEO_BOKEH_DATA_ROOT: /data
    volumes:
    # The library is named separately from the root because the ones on disk are not
    # called "library" -- data/library_dev is the one a fresh clone can build. Inside
    # the container it always lands at /data/library, which is where the api looks by
    # default, so VIDEO_BOKEH_LIBRARY is a host-side setting only.
    - ${VIDEO_BOKEH_LIBRARY:-${VIDEO_BOKEH_DATA_ROOT:-./backend/data}/library}:/data/library:ro
    - ${VIDEO_BOKEH_DATA_ROOT:-./backend/data}/scenes:/data/scenes
